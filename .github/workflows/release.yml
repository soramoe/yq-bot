name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Check tag matches package.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG" ]; then
            echo "package.json 版本是 $PKG，tag 是 $VERSION —— 先把版本号改一致再发"
            exit 1
          fi

      - name: Build update package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="$RUNNER_TEMP/yuyue3-${VERSION}.tar.gz"
          # 逐项列顶层条目，不要 `tar ... .`：后者会写入一条 `./`，
          # 而 0.2.1 及更早版本的解压器会把它当成不安全路径拒绝整包。
          find . -mindepth 1 -maxdepth 1 -printf '%f\n' \
            | grep -v -E '^(data|\.git|\.github)$' \
            | tar -czf "$OUT" -T -
          SHA="$(sha256sum "$OUT" | cut -d' ' -f1)"
          SIZE="$(stat -c%s "$OUT")"
          export VERSION SHA SIZE OUT
          node - <<'NODE'
          const fs = require('fs');
          const { VERSION, SHA, SIZE } = process.env;
          const repo = process.env.GITHUB_REPOSITORY;
          const tag = process.env.GITHUB_REF_NAME;
          const manifest = {
            version: VERSION,
            notes: '见 GitHub Release 说明',
            url: `https://github.com/${repo}/releases/tag/${tag}`,
            download: `https://github.com/${repo}/releases/download/${tag}/yuyue3-${VERSION}.tar.gz`,
            sha256: SHA,
            size: Number(SIZE),
            minVersion: '0.2.0',
          };
          fs.writeFileSync('latest.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/yuyue3-${VERSION}.tar.gz" \
            latest.json \
            --title "渔月崽三代 v${VERSION}" \
            --generate-notes

      # 发版后自动把清单和包同步到 R2 镜像。没配 secrets 时这一步直接跳过，
      # 不影响 Release 本身；配了就不用每次手动跑 mirror-release.mjs。
      - name: Sync mirror (Cloudflare R2)
        env:
          S3_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          S3_SECRET_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -z "$S3_ACCESS_KEY" ] || [ -z "$S3_SECRET_KEY" ]; then
            echo "R2 secrets 未配置，跳过镜像同步"
            exit 0
          fi
          ENDPOINT="${R2_ENDPOINT:-https://7403063f14f3cd4b75b4e28bce4db57e.r2.cloudflarestorage.com}"
          BUCKET="${R2_BUCKET:-yq-mirror}"
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/mirror-release.mjs \
            --s3 "$BUCKET" \
            --endpoint "$ENDPOINT" \
            --prefix yq \
            --manifest-file latest.json \
            --package-file "$RUNNER_TEMP/yuyue3-${VERSION}.tar.gz"

          # 公开地址有缓存，给几次机会再判定；失败只告警，不把 Release 标红。
          BASE="${R2_PUBLIC_BASE:-https://pub-1c052ae1726e4964913fac13a4cbd08f.r2.dev/yq}"
          OK=0
          for i in 1 2 3 4 5; do
            CODE="$(curl -s -o /tmp/mirror-latest.json -w '%{http_code}' "$BASE/latest.json" || true)"
            if [ "$CODE" = "200" ] && grep -q "\"$VERSION\"" /tmp/mirror-latest.json; then
              OK=1
              break
            fi
            sleep 2
          done
          if [ "$OK" = "1" ]; then
            echo "镜像已更新：$BASE/latest.json"
          else
            echo "::warning::镜像公开地址暂时没读到 v$VERSION，稍后手动确认 $BASE/latest.json"
          fi
