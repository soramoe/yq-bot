name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要同步到镜像的 Release tag（留空取最新）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Check tag matches package.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG" ]; then
            echo "package.json 版本是 $PKG，tag 是 $VERSION —— 先把版本号改一致再发"
            exit 1
          fi

      - name: Build update package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="$RUNNER_TEMP/yuyue3-${VERSION}.tar.gz"
          # 逐项列顶层条目，不要 `tar ... .`：后者会写入一条 `./`，
          # 而 0.2.1 及更早版本的解压器会把它当成不安全路径拒绝整包。
          find . -mindepth 1 -maxdepth 1 -printf '%f\n' \
            | grep -v -E '^(data|\.git|\.github)$' \
            | tar -czf "$OUT" -T -
          SHA="$(sha256sum "$OUT" | cut -d' ' -f1)"
          SIZE="$(stat -c%s "$OUT")"
          export VERSION SHA SIZE OUT
          node - <<'NODE'
          const fs = require('fs');
          const { VERSION, SHA, SIZE } = process.env;
          const repo = process.env.GITHUB_REPOSITORY;
          const tag = process.env.GITHUB_REF_NAME;
          const manifest = {
            version: VERSION,
            notes: '见 GitHub Release 说明',
            url: `https://github.com/${repo}/releases/tag/${tag}`,
            download: `https://github.com/${repo}/releases/download/${tag}/yuyue3-${VERSION}.tar.gz`,
            sha256: SHA,
            size: Number(SIZE),
            minVersion: '0.2.0',
          };
          fs.writeFileSync('latest.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/yuyue3-${VERSION}.tar.gz" \
            latest.json \
            --title "渔月崽三代 v${VERSION}" \
            --generate-notes

      # 安装 zip 和更新 tar 走同一份文件清单：tar 给更新器，zip 给人下载。
      - name: Build install zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/make-dist.mjs --out "$RUNNER_TEMP/yuqing-bot-${VERSION}.zip"

      - name: Upload install zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/yuqing-bot-${VERSION}.zip" --clobber

      # 发版后自动把清单和包同步到 R2 镜像。没配 secrets 时这一步直接跳过，
      # 不影响 Release 本身；配了就不用每次手动跑 mirror-release.mjs。
      - name: Sync mirror (Cloudflare R2)
        env:
          S3_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          S3_SECRET_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          bash scripts/ci-sync-mirror.sh \
            latest.json \
            "$RUNNER_TEMP/yuyue3-${GITHUB_REF_NAME#v}.tar.gz"

  # 手动补同步：发版后镜像同步失败，或想重传某个旧版本时用。
  mirror:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="$(gh release view --json tagName -q .tagName -R "$GITHUB_REPOSITORY")"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "${{ steps.tag.outputs.tag }}" \
            -R "$GITHUB_REPOSITORY" \
            --pattern latest.json \
            --dir "$RUNNER_TEMP/release"
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).version" "$RUNNER_TEMP/release/latest.json")"
          gh release download "${{ steps.tag.outputs.tag }}" \
            -R "$GITHUB_REPOSITORY" \
            --pattern "yuyue3-${VERSION}.tar.gz" \
            --dir "$RUNNER_TEMP/release"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync mirror (Cloudflare R2)
        env:
          S3_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          S3_SECRET_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          bash scripts/ci-sync-mirror.sh \
            "$RUNNER_TEMP/release/latest.json" \
            "$RUNNER_TEMP/release/yuyue3-${{ steps.assets.outputs.version }}.tar.gz"
