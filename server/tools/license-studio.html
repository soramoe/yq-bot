<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>渔情LiveBot · 授权签发台</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f141c;
    --card: #171e29;
    --line: #2a3442;
    --fg: #e8eef7;
    --dim: #8b98aa;
    --accent: #6cb6ff;
    --good: #63d29a;
    --bad: #ff8a8a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(1200px 600px at 20% -10%, #1b2838 0%, var(--bg) 55%);
    color: var(--fg);
    font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  main { max-width: 880px; margin: 0 auto; padding: 32px 20px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--dim); margin-bottom: 22px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
  .full { grid-column: 1 / -1; }
  label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 6px; }
  input, select, textarea {
    width: 100%;
    background: #0e141c;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--fg);
    padding: 9px 10px;
    font: inherit;
  }
  textarea { min-height: 62px; resize: vertical; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .chip {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--dim);
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); color: var(--fg); }
  .actions { display: flex; gap: 10px; margin-top: 18px; align-items: center; }
  button.primary {
    background: var(--accent);
    color: #07121f;
    border: 0;
    border-radius: 8px;
    padding: 10px 18px;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary:disabled { opacity: .5; cursor: default; }
  button.ghost {
    background: transparent;
    color: var(--dim);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 14px;
    cursor: pointer;
  }
  .hint { color: var(--dim); font-size: 12px; }
  .result { margin-top: 18px; display: none; }
  .result.show { display: block; }
  .result.ok { border-color: #2f6b4c; }
  .result.bad { border-color: #6b3434; }
  .summary { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; margin: 10px 0 14px; }
  .summary dt { color: var(--dim); }
  .summary dd { margin: 0; word-break: break-all; }
  code.mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .foot { margin-top: 18px; color: var(--dim); font-size: 12px; }
  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main>
  <h1>渔情LiveBot · 授权签发台</h1>
  <div class="sub">填客户发来的机器码和 uid，生成 <code>license.json</code>。只监听本机，签完关掉窗口即可。</div>

  <form id="form" class="card" autocomplete="off">
    <div class="grid">
      <div class="full">
        <label for="machine">客户机器码（64 位十六进制）</label>
        <textarea id="machine" name="machine" required spellcheck="false" placeholder="让客户在「维护 → 授权」里点「复制机器码」"></textarea>
      </div>
      <div>
        <label for="uid">B 站 uid（留空 = 不绑账号）</label>
        <input id="uid" name="uid" inputmode="numeric" placeholder="例如 1970515035" />
      </div>
      <div>
        <label for="customer">客户名 / 备注</label>
        <input id="customer" name="customer" maxlength="40" placeholder="例如 某某工作室" />
      </div>
      <div>
        <label for="edition">版本</label>
        <select id="edition" name="edition">
          <option value="personal">个人版</option>
          <option value="studio">工作室版</option>
        </select>
      </div>
      <div>
        <label for="maxRooms">最多房间数</label>
        <input id="maxRooms" name="maxRooms" type="number" min="1" max="50" value="1" />
      </div>
      <div>
        <label for="days">授权天数（0 = 永久）</label>
        <input id="days" name="days" type="number" min="0" max="36500" value="365" />
        <div class="chips" id="dayChips">
          <button type="button" class="chip" data-days="7">7 天</button>
          <button type="button" class="chip" data-days="30">30 天</button>
          <button type="button" class="chip" data-days="90">90 天</button>
          <button type="button" class="chip" data-days="365">1 年</button>
          <button type="button" class="chip" data-days="0">永久</button>
        </div>
      </div>
      <div>
        <label for="updatesDays">更新期天数（0 = 永久更新）</label>
        <input id="updatesDays" name="updatesDays" type="number" min="0" max="36500" value="365" />
      </div>
      <div class="full">
        <label for="features">功能位（可空，逗号分隔）</label>
        <input id="features" name="features" placeholder="例如 pk, highlighter" />
      </div>
    </div>

    <div class="actions">
      <button id="sign" class="primary" type="submit">生成授权</button>
      <button id="reset" class="ghost" type="button">清空</button>
      <span class="hint">私钥只在这台电脑上，不会发到浏览器。</span>
    </div>
  </form>

  <section id="result" class="card result" aria-live="polite">
    <strong id="resultTitle"></strong>
    <dl id="summary" class="summary"></dl>
    <div class="actions">
      <button id="download" class="primary" type="button">下载 license.json</button>
      <button id="copy" class="ghost" type="button">复制 JSON</button>
    </div>
    <div class="foot" id="foot"></div>
  </section>

  <div class="foot">个人版预估参考价约 ¥199（含一年更新），最终价格与条款以购买页为准。</div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let current = null;

function fmt(ts) {
  if (!ts) return '永久';
  return new Date(ts).toLocaleString('zh-CN', { hour12: false });
}

function showResult(obj) {
  current = obj;
  const box = $('result');
  box.className = 'card result show ok';
  $('resultTitle').textContent = '已生成授权';
  const s = obj.summary;
  $('summary').innerHTML = [
    ['文件', obj.filename],
    ['机器码', s.machine],
    ['uid', s.uid || '不绑定'],
    ['客户', s.customer || '（未填）'],
    ['版本', s.edition === 'studio' ? '工作室版' : '个人版'],
    ['房间数', String(s.maxRooms)],
    ['授权到期', fmt(s.expiresAt)],
    ['更新期至', fmt(s.updatesUntil)],
  ].map(([k, v]) => `<dt>${k}</dt><dd><code class="mono">${String(v)}</code></dd>`).join('');
  $('foot').textContent = '把下载到的 license.json 放到客户安装目录的 data\\license.json，然后重启服务。';
}

function showError(message) {
  current = null;
  const box = $('result');
  box.className = 'card result show bad';
  $('resultTitle').textContent = '没签成';
  $('summary').innerHTML = `<dt>原因</dt><dd>${message}</dd>`;
  $('foot').textContent = '';
}

$('dayChips').addEventListener('click', (e) => {
  const days = e.target?.dataset?.days;
  if (days !== undefined) $('days').value = days;
});

$('reset').addEventListener('click', () => {
  $('form').reset();
  $('maxRooms').value = '1';
  $('days').value = '365';
  $('updatesDays').value = '365';
  current = null;
  $('result').className = 'card result';
});

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('sign');
  btn.disabled = true;
  try {
    const body = {
      machine: $('machine').value,
      uid: $('uid').value,
      customer: $('customer').value,
      edition: $('edition').value,
      maxRooms: Number($('maxRooms').value),
      days: $('days').value === '' ? 0 : Number($('days').value),
      updatesDays: $('updatesDays').value === '' ? 0 : Number($('updatesDays').value),
      features: $('features').value,
    };
    const res = await fetch('/api/sign', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({ ok: false, error: `HTTP ${res.status}` }));
    if (!data.ok) throw new Error(data.error || '签发失败');
    showResult(data);
  } catch (err) {
    showError(err.message);
  } finally {
    btn.disabled = false;
  }
});

$('download').addEventListener('click', () => {
  if (!current) return;
  const blob = new Blob([JSON.stringify(current.license, null, 2) + '\n'], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = current.filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

$('copy').addEventListener('click', async () => {
  if (!current) return;
  try {
    await navigator.clipboard.writeText(JSON.stringify(current.license, null, 2));
    $('foot').textContent = '已复制到剪贴板。';
  } catch {
    $('foot').textContent = '浏览器没给剪贴板权限，用下载吧。';
  }
});
</script>
</body>
</html>
