<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0d11" />
    <title>渔月崽三代 · 观测台</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS 不读 manifest 的图标和显示模式，这两行是它自己的规矩 -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="渔月崽" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="dot" id="live-dot"></span>
          <span class="name">渔月崽三代</span>
          <span class="sep">/</span>
          <span class="room" id="room-label">连接中…</span>
        </div>

        <div class="top-actions">
          <span class="pill is-warn" id="offline-pill" hidden>离线</span>
          <span class="pill" id="mode-pill">演练</span>
          <span class="pill" id="conn-pill"><span class="dot"></span><span id="conn-text">连接中</span></span>
          <label class="switch" title="演练模式下走完整链路，但不真的发弹幕">
            <input type="checkbox" id="dryrun-toggle" checked />
            <span>演练模式</span>
          </label>
          <button class="btn btn-pk" id="btn-pk" type="button">PK 情报</button>
          <button class="btn btn-songs" id="btn-songs" type="button">点歌队列<span class="badge" id="songs-badge" hidden>0</span></button>
          <button class="btn btn-sc" id="btn-sc" type="button">SC 待读<span class="badge" id="sc-badge" hidden>0</span></button>
          <button class="btn" id="btn-patrons" type="button">付费用户榜</button>
          <button class="btn" id="btn-reports" type="button">战报</button>
          <button class="btn" id="btn-plugins" type="button">插件</button>
          <button class="btn" id="btn-room" type="button">换房间</button>
        </div>
      </header>

      <main class="main">
        <section class="stats" id="stats" aria-label="本场统计"></section>

        <section class="card" aria-label="实时事件">
          <div class="card-head">
            <h2>实时事件</h2>
            <span class="count" id="ev-count"></span>
            <span class="spacer"></span>
          </div>
          <div class="stream-tools">
            <div class="filters" id="filters" role="group" aria-label="事件筛选"></div>
          </div>
          <div class="stream-body" id="stream">
            <div class="stream-empty">等待事件…</div>
          </div>
          <button class="jump" id="jump" type="button" hidden>有新事件 ↓</button>
        </section>
      </main>

      <aside class="side" id="side"></aside>
    </div>

    <dialog id="dlg-room" class="dlg-wide">
      <form method="dialog" class="dlg-body" id="room-form">
        <h4>房间总览</h4>
        <p>切换只是换个视图：后台那间继续收弹幕、记日志。最多同时盯 10 间。</p>
        <div class="room-summary" id="room-summary"></div>
        <div class="room-list" id="room-list"></div>
        <input id="room-input" type="text" inputmode="numeric" autocomplete="off" placeholder="再打开一间，例如 1901584685" />
        <div class="room-notify">
          <label for="notify-input">开播/下播提醒 webhook（企微、钉钉、飞书机器人；留空只弹页内提示）</label>
          <div class="room-notify-row">
            <input id="notify-input" type="url" autocomplete="off" spellcheck="false" placeholder="https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=…" />
            <button class="btn" type="button" id="notify-save">保存</button>
          </div>
          <label class="room-notify-check" for="notify-report">
            <input id="notify-report" type="checkbox" />
            下播后把本场战报发到同一个 webhook
          </label>
        </div>
        <div class="room-push">
          <label for="push-provider">手机推送（开播 / 下播 / 大额；战报不推手机）</label>
          <div class="room-notify-row">
            <select id="push-provider" class="room-push-select">
              <option value="">关闭</option>
              <option value="bark">Bark（iOS）</option>
              <option value="ntfy">ntfy（全平台）</option>
              <option value="serverchan">Server酱（微信）</option>
              <option value="telegram">Telegram</option>
            </select>
            <input id="push-target" type="text" autocomplete="off" spellcheck="false" placeholder="key / topic / SendKey / token|chat_id" />
          </div>
          <div class="room-notify-row">
            <button class="btn" type="button" id="push-save">保存</button>
            <button class="btn" type="button" id="push-test">发测试</button>
          </div>
          <p class="room-goal-hint" id="push-hint"></p>
          <label class="room-notify-check" for="push-weekly">
            <input id="push-weekly" type="checkbox" /> 每周一 10:00 把最近 7 天的周报推到手机
          </label>
        </div>
        <div class="room-obs">
          <label class="room-notify-check" for="obs-enabled">
            <input id="obs-enabled" type="checkbox" /> 开播 / 下播时切 OBS 场景
          </label>
          <div class="room-notify-row">
            <input id="obs-url" type="text" autocomplete="off" spellcheck="false" placeholder="ws://127.0.0.1:4455" />
          </div>
          <div class="room-notify-row">
            <input id="obs-password" type="password" autocomplete="new-password" placeholder="OBS WebSocket 密码（没设密码就留空）" />
            <button class="btn" type="button" id="obs-clear-pass">清空密码</button>
          </div>
          <div class="room-notify-row">
            <input id="obs-live-scene" type="text" autocomplete="off" spellcheck="false" placeholder="开播切到场景名" />
            <input id="obs-offline-scene" type="text" autocomplete="off" spellcheck="false" placeholder="下播切回场景名" />
            <button class="btn" type="button" id="obs-save">保存 OBS</button>
          </div>
          <p class="room-goal-hint" id="obs-hint"></p>
        </div>
        <div class="room-goal">
          <label for="goal-input">本场礼物目标（元，0 = 关闭；下播再开重新算）</label>
          <div class="room-notify-row">
            <input id="goal-input" type="number" min="0" step="1" inputmode="decimal" autocomplete="off" placeholder="例如 1000" />
            <button class="btn" type="button" id="goal-save">保存</button>
          </div>
          <label class="room-notify-check" for="goal-announce">
            <input id="goal-announce" type="checkbox" />
            到 30% / 60% / 80% / 100% 时在弹幕里播报
          </label>
          <div class="room-goal-texts">
            <label for="goal-text-30">30% 文案<input id="goal-text-30" type="text" maxlength="80" autocomplete="off" placeholder="留空用默认" /></label>
            <label for="goal-text-60">60% 文案<input id="goal-text-60" type="text" maxlength="80" autocomplete="off" placeholder="留空用默认" /></label>
            <label for="goal-text-80">80% 文案<input id="goal-text-80" type="text" maxlength="80" autocomplete="off" placeholder="留空用默认" /></label>
            <label for="goal-text-100">100% 文案<input id="goal-text-100" type="text" maxlength="80" autocomplete="off" placeholder="留空用默认" /></label>
          </div>
          <p class="room-goal-hint">自定义文案可用 {当前}、{目标}、{百分比} 三个占位符。</p>
        </div>
        <div class="dlg-actions">
          <button class="btn" type="button" id="room-cancel">取消</button>
          <button class="btn primary" value="ok" type="submit" id="room-ok">打开这间</button>
        </div>
      </form>
    </dialog>

    <dialog id="dlg-reports" class="dlg-wide"></dialog>

    <dialog id="dlg-patrons" class="dlg-wide"></dialog>

    <dialog id="dlg-sc" class="dlg-wide"></dialog>

    <dialog id="dlg-songs" class="dlg-wide"></dialog>

    <dialog id="dlg-pk" class="dlg-wide"></dialog>

    <dialog id="dlg-plugins" class="dlg-wide">
      <div class="plg-wrap">
        <header class="plg-head">
          <h4>插件</h4>
          <button class="btn" type="button" id="plg-close">关闭</button>
        </header>
        <div class="plg-tabs" id="plg-tabs" role="tablist"></div>
        <div class="plg-body" id="plg-body"></div>
      </div>
    </dialog>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
